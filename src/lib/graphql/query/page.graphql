query PageContent($uri: String = "") {
  nodeByUri(uri: $uri) {
    ... on Page {
      id
      title
      date
      editorBlocks {
        ...CommonBlockFields
      }
    }
    ... on Post {
      id
      title
      date
      featuredImage {
        node {
          altText
          mediaDetails {
            sizes {
              name
              mimeType
              height
              width
              sourceUrl
            }
          }
        }
      }
      editorBlocks {
        ...CommonBlockFields
      }
    }
  }
}

fragment BlockBasicFields on EditorBlock {
  name
  parentClientId
  clientId
  __typename
}

fragment CommonBlockFields on EditorBlock {
  ...BlockBasicFields
  ... on CoreVideo {
    attributes {
      autoplay
      preload
      src
      muted
      controls
      caption
      poster
      align
      loop
      className
    }
  }
  ... on CoreEmbed {
    renderedHtml
    attributes {
      align
      url
      className
    }
  }
  ... on AcfSignupForm {
    signupForm {
      formId
      emailField
      phoneField
      postcodeField
      unionList
      workplace
    }
    attributes {
      align
      backgroundColor
      textColor
      className
    }
  }
  ... on AcfHomeSection {
    attributes {
      align
      backgroundColor
      textColor
      className
    }
    innerBlocks {
      name
      parentClientId
      clientId
    }
    homeSection {
      accordeonlabel
      defaultActive
    }
  }
  ... on CoreQuery {
    apiVersion
    blockEditorCategoryName
    isDynamic
    attributes {
      align
      layout
      metadata
      query
    }
  }
  ... on CorePostTemplate {
    attributes {
      align
      backgroundColor
      fontFamily
      fontSize
      layout
      metadata
    }
  }
  ... on CoreImage {
    mediaDetails {
      sizes(exclude: [MEDIUM_LARGE, MEDIUM]) {
        sourceUrl
        height
        width
        mimeType
        name
      }
    }
    attributes {
      align
      title
      alt
      url
      caption
      aspectRatio
      className
    }
  }
  ... on CoreParagraph {
    attributes {
      content
      fontFamily
      fontSize
      textColor
      align
      className
    }
  }
  ... on CoreFootnotes {
    renderedHtml
    innerBlocks {
      name
    }
    attributes {
      metadata
      className
    }
  }
  ... on CoreMore {
    attributes {
      customText
    }
  }
  ... on AcfHeaderAnimation {
    apiVersion
    blockEditorCategoryName
    headerAnimation {
      statements {
        statement
        bgcolor
        textcolor
      }
    }
    attributes {
      align
      backgroundColor
      textColor
      className
    }
  }
  ... on AcfTickerNumber {
    currentCount
    attributes {
      align
      backgroundColor
      textColor
      className
    }
    tickerNumber {
      incrementBy
    }
  }
  ... on CoreHeading {
    attributes {
      content
      className
      fontFamily
      fontSize
      textColor
      textAlign
      level
      align
    }
  }
  ... on CoreColumns {
    attributes {
      backgroundColor
      className
      layout
      className
      verticalAlignment
      style
      align
      isStackedOnMobile
    }
  }
  ... on CoreColumn {
    attributes {
      backgroundColor
      layout
      className
      verticalAlignment
      style
      width
    }
  }
  ... on CoreGroup {
    attributes {
      backgroundColor
      className
      align
      style
    }
  }
  ... on CoreButton {
    attributes {
      backgroundColor
      style
      className
      fontSize
      linkTarget
      text
      url
    }
    innerBlocks {
      ...BlockBasicFields
    }
  }
  ... on CoreButtons {
    attributes {
      align
      className
      layout
    }
  }
  ... on CoreSpacer {
    attributes {
      height
      className
      style
      className
    }
  }
}